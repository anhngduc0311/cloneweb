services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: truyendex
      POSTGRES_USER: truyendex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truyendex -d truyendex"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: ./backend/TruyenDex.Api
    environment:
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__Database: Host=db;Database=truyendex;Username=truyendex;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Run scripts/setup.ps1 first}
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@truyendex.local}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Run scripts/setup.ps1 first}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5080:5080"
  web:
    build: ./frontend
    depends_on: [api]
    ports:
      - "127.0.0.1:4200:80"
volumes:
  postgres_data:
